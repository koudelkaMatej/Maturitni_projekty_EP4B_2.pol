<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffd5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1e6cff" stop-opacity="0.18"/>
    </linearGradient>
    <style>
      .box { fill: url(#g); stroke: rgba(255,255,255,0.22); stroke-width: 2; }
      .head { fill: rgba(0,0,0,0.25); }
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: rgba(233,240,255,0.95); }
      .h { font-weight: 900; font-size: 18px; }
      .f { font-size: 14px; fill: rgba(233,240,255,0.80); }
      .k { font-weight: 700; }
      .line { stroke: rgba(233,240,255,0.55); stroke-width: 3; }
      .card { filter: drop-shadow(0 16px 32px rgba(0,0,0,0.35)); }
      .note { font-size: 12px; fill: rgba(233,240,255,0.68); }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="380" fill="rgba(0,0,0,0)"/>

  <g class="card">
    <rect class="box" x="90" y="70" rx="16" ry="16" width="330" height="240"/>
    <rect class="head" x="90" y="70" rx="16" ry="16" width="330" height="54"/>
    <text class="t h" x="118" y="105">PLAYERS</text>
    <text class="t f" x="118" y="150"><tspan class="k">id</tspan> (PK) : INTEGER</text>
    <text class="t f" x="118" y="182"><tspan class="k">name</tspan> : TEXT</text>
    <text class="t f" x="118" y="214"><tspan class="k">created_at</tspan> : TEXT</text>
    <text class="t note" x="118" y="270">1 hráč → více záznamů skóre</text>
  </g>

  <g class="card">
    <rect class="box" x="560" y="70" rx="16" ry="16" width="330" height="240"/>
    <rect class="head" x="560" y="70" rx="16" ry="16" width="330" height="54"/>
    <text class="t h" x="588" y="105">SCORES</text>
    <text class="t f" x="588" y="150"><tspan class="k">id</tspan> (PK) : INTEGER</text>
    <text class="t f" x="588" y="182"><tspan class="k">player_id</tspan> (FK) : INTEGER</text>
    <text class="t f" x="588" y="214"><tspan class="k">difficulty</tspan> : TEXT</text>
    <text class="t f" x="588" y="246"><tspan class="k">score</tspan> : INTEGER</text>
    <text class="t f" x="588" y="278"><tspan class="k">created_at</tspan> : TEXT</text>
  </g>

  <line class="line" x1="420" y1="190" x2="560" y2="190"/>
  <circle cx="420" cy="190" r="6" fill="rgba(233,240,255,0.55)"/>
  <circle cx="560" cy="190" r="6" fill="rgba(233,240,255,0.55)"/>

  <text class="t f" x="448" y="176">1</text>
  <text class="t f" x="535" y="176">N</text>
  <text class="t note" x="460" y="214">has</text>
</svg>
